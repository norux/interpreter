<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jamak · Advanced</title><link rel="stylesheet" href="./host.css"></head>
<body class="advanced">
<header class="header"><img class="mark" src="./icons/jamak.svg" alt="" width="40" height="40"><div><h1>Advanced</h1><p class="subtitle">받아쓰기와 번역 모델을 따로 선택해 비교하세요.</p></div></header>
<main>
<section class="model-choice"><label for="recognition">받아쓰기 모델</label><select id="recognition"></select><p id="recognition-detail"></p></section>
<section class="model-choice"><label for="translation">번역 모델</label><select id="translation"></select><p id="translation-detail"></p></section>
<p class="preparation-status">모델은 기기 안에서 실행됩니다. 선택하면 없는 파일을 바로 다운로드하며, 모델별 반응 속도와 정확도는 다를 수 있습니다.</p>
<p class="preparation-status">모델을 바꾸면 현재 번역이 중지됩니다. 준비가 끝나면 원래 탭의 Jamak 팝업에서 번역을 다시 시작하세요.</p>
<div class="advanced-actions"><button id="retry" type="button">다시 준비</button><button id="stop" type="button">다운로드 중지</button><button id="reset" type="button">양쪽 모두 Chrome 기본값</button></div>
<p id="status" role="status" aria-live="polite"></p>
</main><script type="module" src="./advanced.ts"></script></body></html>
