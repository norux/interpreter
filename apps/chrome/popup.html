<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jamak</title><link rel="stylesheet" href="./host.css"></head>
<body class="popup">
<header class="header"><img class="mark" src="./icons/jamak.svg" alt="" width="40" height="40"><div><h1>Jamak</h1><p class="subtitle">탭의 음성을 한국어 자막으로</p></div></header>
<section class="setup"><label>영상 언어 <select id="language"><option value="ja">日本語 · 일본어</option><option value="en">English · 영어</option></select></label></section>
<main class="interpretation-controls">
<section id="model-setup"><p id="model-description"></p><button type="button" id="prepare" disabled>모델 다운로드</button></section>
<section id="translation-controls" hidden><button type="button" id="start" disabled>번역 시작</button><button type="button" id="stop" disabled>중지</button><button type="button" id="reference">원문 · 번역 기록 열기</button></section>
<p id="status" class="preparation-status" role="status">연결 중…</p>
<details id="model-details" hidden><summary>모델 정보</summary><p id="diagnostic"></p></details>
</main>
<script type="module" src="./popup.ts"></script></body></html>
