<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jamak</title><link rel="stylesheet" href="./host.css"></head>
<body>
<header class="header"><img class="mark" src="./icons/jamak.svg" alt="" width="40" height="40"><div><h1>Jamak</h1><p class="subtitle">선택한 영상의 음성을 한국어 자막으로</p></div><span class="badge">기기 내 번역</span></header>
<details class="connection-details"><summary>연결 정보 · 사용 안내</summary>
<p>페이지의 영상을 선택한 뒤 모델을 준비해 주세요. 번역 중에는 이 창을 화면에 유지해 주세요.</p>
<p id="fullscreen-support">Captions follow the selected video inline and in a fullscreen player container. Video-only fullscreen hides page captions; the comparison window remains available.</p>
<p id="connection" role="status"></p>
</details>
<section class="setup" aria-label="Select video"><label>영상 <select id="video"><option value="">Choose a video</option></select></label>
<label>영상 언어 <select id="language"><option value="ja">日本語 · 일본어</option><option value="en">English · 영어</option></select></label>
<button type="button" id="confirm">영상 선택</button></section>
<main id="app"></main><script type="module" src="./host.ts"></script>
</body></html>
