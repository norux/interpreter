[project]
name = "interpreter-companion"
version = "0.1.0"
description = "Loopback companion for the Interpreter Chrome extension"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn[standard]", "httpx", "webrtcvad-wheels", "websockets", "anyio"]

[project.optional-dependencies]
local = ["mlx-audio[stt]==0.5.8"]

[dependency-groups]
dev = ["httpx2", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
