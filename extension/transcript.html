<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interpreter · 원문과 번역</title>
  </head>
  <body>
    <header>
      <div><h1>원문과 번역</h1><p>Chrome 탭의 음성 인식 원문 · 시간은 녹음 시작 기준</p></div>
      <p id="status" role="status">연결 중</p>
    </header>
    <main>
      <p id="empty">오디오가 재생되는 Chrome 탭에서 Interpreter의 Start를 누르세요.</p>
      <div class="comparison">
        <table aria-label="발화별 원문과 번역 비교">
          <colgroup><col class="source-column" /><col class="time-column" /><col class="translation-column" /></colgroup>
          <thead><tr><th scope="col">원문</th><th scope="col">시간</th><th scope="col">번역</th></tr></thead>
          <tbody id="sentences"></tbody>
        </table>
      </div>
    </main>
    <footer><span id="retention">최근 300개 발화 · 새 녹음을 시작하면 초기화됩니다.</span><span>음성 인식 결과에 오류가 있을 수 있습니다.</span></footer>
    <script type="module" src="./transcript/view.ts"></script>
  </body>
</html>
