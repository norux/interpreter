<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Selected video catalog fixture</title>
<style>
  body { font: 16px system-ui; margin: 24px; }
  video { width: 320px; height: 180px; background: #ddd; }
  #controls { padding: 16px; border: 1px solid #777; }
  select, button { font: inherit; margin: 8px; }
</style>
<h1>Explicit video selection</h1>
<video id="main" aria-label="Main video" controls preload="none" src="/main.mp4">
  <track kind="captions" srclang="en" label="Silent selection fixture" src="data:text/vtt,WEBVTT%0A%0A">
</video>
<video id="other" aria-label="Other video" controls preload="none" src="/other.mp4">
  <track kind="captions" srclang="en" label="Silent selection fixture" src="data:text/vtt,WEBVTT%0A%0A">
</video>
<video id="hidden" aria-label="Hidden video" style="display:none" preload="none">
  <track kind="captions" srclang="en" label="Silent selection fixture" src="data:text/vtt,WEBVTT%0A%0A">
</video>
<iframe title="Same-origin frame" src="/frame.html"></iframe>
<iframe title="Other-origin frame" src="http://localhost:1/frame.html"></iframe>
<div id="controls"></div>
<script type="module">
  import { createMediaCatalog } from '/catalog.js';
  import { mountVideoSelection } from '/selection.js';
  const catalog = createMediaCatalog(document, 'fixture-top-frame');
  const selections = [];
  const selection = mountVideoSelection(document.querySelector('#controls'), catalog, (target) => selections.push(target));
  Object.assign(globalThis, { catalog, selection, selections });
  await selection.ready;
  globalThis.fixtureReady = true;
</script>
</html>
