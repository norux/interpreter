<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Interpreter tab audio fixture</title></head>
  <body>
    <h1>Generated non-sensitive stereo test audio</h1>
    <p>440 Hz left, 880 Hz right; no microphone, file, or transcript.</p>
    <button id="play" type="button">Play test audio</button>
    <button id="pause" type="button">Pause test audio</button>
    <p id="state">stopped</p>
    <script>
      let context;
      document.querySelector('#play').addEventListener('click', async () => {
        if (!context) {
          context = new AudioContext();
          const merger = context.createChannelMerger(2);
          for (const [index, frequency] of [440, 880].entries()) {
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            oscillator.frequency.value = frequency;
            gain.gain.value = 0.1;
            oscillator.connect(gain).connect(merger, 0, index);
            oscillator.start();
          }
          merger.connect(context.destination);
        }
        await context.resume();
        document.querySelector('#state').textContent = 'playing';
      });
      document.querySelector('#pause').addEventListener('click', async () => {
        await context?.suspend();
        document.querySelector('#state').textContent = 'paused';
      });
    </script>
  </body>
</html>
